<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ destination }} | TravelGo</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            font-family:
                Arial,
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #ff512f,
                    #dd2476,
                    #7f00ff,
                    #00c6ff,
                    #00d084
                );

            background-size: 400% 400%;

            animation:
                gradientMove 14s ease infinite;

            padding: 30px 25px 35px;

            overflow-x: hidden;
        }


        /* =========================
           ANIMATED BACKGROUND
        ========================= */

        @keyframes gradientMove {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        /* =========================
           FLOATING SHAPES
        ========================= */

        .shape {

            position: fixed;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.18);

            backdrop-filter:
                blur(10px);

            pointer-events: none;

            z-index: -1;

            animation:
                floating 7s ease-in-out infinite;
        }


        .shape1 {

            width: 140px;
            height: 140px;

            top: 8%;
            left: -50px;
        }


        .shape2 {

            width: 220px;
            height: 220px;

            right: -90px;
            top: 35%;

            animation-delay: 2s;
        }


        .shape3 {

            width: 100px;
            height: 100px;

            bottom: 5%;
            left: 10%;

            animation-delay: 4s;
        }


        @keyframes floating {

            0%,
            100% {

                transform:
                    translateY(0)
                    rotate(0deg);
            }

            50% {

                transform:
                    translateY(-35px)
                    rotate(20deg);
            }

        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .main-container {

            width: 100%;

            max-width: 1250px;

            margin: 0 auto;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            text-decoration: none;

            color: white;

            background:
                rgba(0, 0, 0, 0.25);

            border:
                1px solid
                rgba(255, 255, 255, 0.35);

            backdrop-filter:
                blur(12px);

            padding: 11px 20px;

            border-radius: 50px;

            font-size: 15px;

            font-weight: bold;

            transition: 0.3s;

            animation:
                slideRight 0.8s ease;
        }


        .back:hover {

            background:
                rgba(255, 255, 255, 0.25);

            transform:
                translateX(-6px)
                scale(1.03);
        }


        @keyframes slideRight {

            from {

                opacity: 0;

                transform:
                    translateX(-40px);
            }

            to {

                opacity: 1;

                transform:
                    translateX(0);
            }

        }


        /* =========================
           HEADER
        ========================= */

        .hero {

            text-align: center;

            padding: 20px 10px 32px;

            animation:
                titleAppear 1s ease;
        }


        .hero .tag {

            display: inline-block;

            padding: 8px 18px;

            border-radius: 50px;

            color: white;

            font-size: 14px;

            background:
                rgba(255, 255, 255, 0.2);

            border:
                1px solid
                rgba(255, 255, 255, 0.3);

            backdrop-filter:
                blur(12px);

            margin-bottom: 15px;
        }


        .hero h1 {

            font-size:
                clamp(35px, 5vw, 58px);

            color: white;

            text-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.25);

            margin-bottom: 12px;
        }


        .hero h1 span {

            color: #fff6a5;
        }


        .hero p {

            color:
                rgba(255, 255, 255, 0.9);

            font-size: 17px;
        }


        @keyframes titleAppear {

            from {

                opacity: 0;

                transform:
                    translateY(-40px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        /* =========================
           GRID
        ========================= */

        .places-container {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(260px, 1fr)
                );

            gap: 28px;

            padding: 0;

            margin: 0;
        }


        /* =========================
           CARD
        ========================= */

        .place-card {

            position: relative;

            background:
                rgba(255, 255, 255, 0.96);

            border-radius: 24px;

            overflow: hidden;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.22);

            transition:
                transform 0.4s ease,
                box-shadow 0.4s ease;

            animation:
                cardEntry 0.8s ease both;
        }


        .place-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .place-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .place-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .place-card:nth-child(4) {
            animation-delay: 0.4s;
        }

        .place-card:nth-child(5) {
            animation-delay: 0.5s;
        }

        .place-card:nth-child(6) {
            animation-delay: 0.6s;
        }


        @keyframes cardEntry {

            from {

                opacity: 0;

                transform:
                    translateY(50px)
                    scale(0.95);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        .place-card:hover {

            transform:
                translateY(-12px)
                scale(1.02);

            box-shadow:
                0 25px 55px
                rgba(0, 0, 0, 0.32);
        }


        /* =========================
           IMAGE
        ========================= */

        .image-box {

            width: 100%;

            height: 180px;

            overflow: hidden;

            position: relative;
        }


        .image-box img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

            transition:
                transform 0.6s ease;
        }


        .place-card:hover img {

            transform:
                scale(1.15);
        }


        /* IMAGE OVERLAY */

        .image-box::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    45deg,
                    rgba(255, 81, 47, 0.25),
                    rgba(127, 0, 255, 0.15),
                    rgba(0, 198, 255, 0.15)
                );

            pointer-events: none;
        }


        /* =========================
           CONTENT
        ========================= */

        .card-content {

            padding: 20px 18px 22px;

            text-align: center;

            position: relative;
        }


        .place-number {

            position: absolute;

            width: 38px;
            height: 38px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            top: -19px;
            right: 18px;

            color: white;

            font-weight: bold;

            background:
                linear-gradient(
                    135deg,
                    #ff512f,
                    #7f00ff
                );

            box-shadow:
                0 5px 15px
                rgba(127, 0, 255, 0.35);
        }


        .card-content h2 {

            color: #26354a;

            font-size: 22px;

            margin-bottom: 9px;

            transition: 0.3s;
        }


        .place-card:hover h2 {

            color: #7f00ff;
        }


        .location {

            display: inline-block;

            color: #65748a;

            font-size: 14px;

            padding: 7px 14px;

            border-radius: 20px;

            background: #f1f3f8;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {

                padding:
                    20px 15px 25px;
            }


            .hero {

                padding:
                    25px 5px 30px;
            }


            .hero p {

                font-size: 15px;
            }


            .places-container {

                grid-template-columns:
                    1fr;

                gap: 22px;
            }


            .image-box {

                height: 190px;
            }

        }

    </style>

</head>


<body>


    <!-- FLOATING SHAPES -->

    <div class="shape shape1"></div>

    <div class="shape shape2"></div>

    <div class="shape shape3"></div>



    <div class="main-container">


        <!-- BACK BUTTON -->

        <a
            href="{% url 'places_to_visit' %}"
            class="back"
        >

            ← Back to Destinations

        </a>



        <!-- HERO -->

        <div class="hero">

            <div class="tag">

                ✈️ TravelGo Explorer

            </div>


            <h1>

                Discover
                <span>{{ destination }}</span>
                ✨

            </h1>


            <p>

                Explore beautiful places and create unforgettable memories 🌍

            </p>

        </div>



        <!-- PLACES -->

        <div class="places-container">


            {% for place in places %}


            <div class="place-card">


                <div class="image-box">

                    <img
                        src="{{ place.image }}"
                        alt="{{ place.name }}"
                    >

                </div>



                <div class="card-content">


                    <div class="place-number">

                        {{ forloop.counter }}

                    </div>


                    <h2>

                        {{ place.name }}

                    </h2>


                    <div class="location">

                        📍 {{ destination }}

                    </div>
                    <a
    href="https://www.google.com/maps/dir/?api=1&destination={{ place.name|urlencode }}%20{{ destination|urlencode }}&travelmode=driving&dir_action=navigate"
    target="_blank"
    rel="noopener"
    style="
        display: inline-block;
        margin-top: 15px;
        padding: 11px 20px;
        border-radius: 30px;
        background: linear-gradient(135deg, #ff512f, #7f00ff);
        color: white;
        text-decoration: none;
        font-weight: bold;
    "
>
    🗺️ Get Directions
</a>
<form method="POST" action="{% url 'wishlist_add' %}" style="margin-top: 10px;">

    {% csrf_token %}

    <input
        type="hidden"
        name="destination"
        value="{{ destination }}"
    >

    <input
        type="hidden"
        name="place_name"
        value="{{ place.name }}"
    >

    <button
        type="submit"
        style="
            padding: 11px 20px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff4b6e, #ff1744);
            color: white;
            font-weight: bold;
            cursor: pointer;
        "
    >
        ❤️ Add to Wishlist
    </button>

</form>


                </div>


            </div>


            {% endfor %}


        </div>


    </div>


</body>

</html>
