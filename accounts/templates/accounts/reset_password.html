```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - TravelGo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c, #764ba2, #667eea);
            background-size: 300% 300%;
            animation: bgMove 8s ease infinite;
            overflow: hidden;
        }

        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.14);
            animation: move 7s infinite ease-in-out;
        }

        .bubble1 {
            width: 220px;
            height: 220px;
            left: 5%;
            top: 10%;
        }

        .bubble2 {
            width: 300px;
            height: 300px;
            right: -80px;
            bottom: -100px;
            animation-delay: 2s;
        }

        @keyframes move {
            0%,100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-35px) rotate(10deg); }
        }

        .card {
            width: 420px;
            padding: 45px 38px;
            background: rgba(255,255,255,0.95);
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.25);
            position: relative;
            z-index: 2;
            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.85) translateY(40px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .icon {
            font-size: 45px;
            margin-bottom: 8px;
        }

        h1 {
            color: #4b3692;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .input-box {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #444;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e4e4e4;
            border-radius: 14px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 12px rgba(118,75,162,0.25);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg, #ff758c, #764ba2, #667eea);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(118,75,162,0.35);
        }

        .back {
            display: inline-block;
            margin-top: 22px;
            text-decoration: none;
            color: #667eea;
            font-weight: 600;
        }

        .message {
            margin-bottom: 15px;
            color: #d9534f;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="bubble bubble1"></div>
<div class="bubble bubble2"></div>

<div class="card">

    <div class="icon">🔐✨</div>

    <h1>Reset Password</h1>

    <p class="subtitle">
        Create a new password for your<br>
        TravelGo account.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="input-box">
            <label>New Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter new password"
                required
            >
        </div>

        <div class="input-box">
            <label>Confirm Password</label>
            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm new password"
                required
            >
        </div>

        <button type="submit">
            Change Password 🚀
        </button>
    </form>

    <a href="{% url 'login' %}" class="back">
        ← Back to Login
    </a>

</div>

</body>
</html>
