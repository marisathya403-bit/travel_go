<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Live Weather | TravelGo</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            font-family:Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2,
                    #f093fb
                );

            display:flex;
            justify-content:center;
            align-items:center;

            padding:30px;
        }

        .weather-container{

            width:100%;
            max-width:650px;

            background:rgba(255,255,255,0.18);

            backdrop-filter:blur(15px);

            border:1px solid rgba(255,255,255,0.3);

            border-radius:25px;

            padding:35px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.25);

            animation:fadeIn 0.8s ease;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        h1{

            text-align:center;

            color:white;

            font-size:32px;

            margin-bottom:10px;
        }

        .subtitle{

            text-align:center;

            color:#f5f5f5;

            margin-bottom:30px;
        }


        /* DESTINATION BUTTONS */

        .destination-grid{

            display:grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap:15px;

            margin-bottom:25px;
        }

        .destination-btn{

            text-decoration:none;

            background:
                rgba(255,255,255,0.9);

            color:#5b3f9b;

            padding:18px;

            border-radius:15px;

            text-align:center;

            font-weight:bold;

            transition:0.3s;

            box-shadow:
                0 8px 20px rgba(0,0,0,0.15);
        }

        .destination-btn:hover{

            transform:
                translateY(-5px)
                scale(1.03);

            background:white;

            box-shadow:
                0 15px 30px rgba(0,0,0,0.2);
        }

        .destination-btn.active{

            background:
                linear-gradient(
                    135deg,
                    #ff9966,
                    #ff5e62
                );

            color:white;
        }


        /* WEATHER CARD */

        .weather-card{

            background:rgba(255,255,255,0.95);

            border-radius:20px;

            padding:30px;

            text-align:center;

            animation:cardPop 0.5s ease;
        }

        @keyframes cardPop{

            from{
                transform:scale(0.9);
                opacity:0;
            }

            to{
                transform:scale(1);
                opacity:1;
            }

        }

        .city{

            font-size:28px;

            font-weight:bold;

            color:#333;
        }

        .temperature{

            font-size:70px;

            font-weight:bold;

            margin:15px 0;

            color:#6c4ab6;
        }

        .description{

            font-size:20px;

            color:#555;

            text-transform:capitalize;

            margin-bottom:25px;
        }

        .details{

            display:grid;

            grid-template-columns:
                1fr 1fr;

            gap:15px;
        }

        .detail-box{

            padding:18px;

            border-radius:15px;

            background:#f1edff;

            transition:0.3s;
        }

        .detail-box:hover{

            transform:
                translateY(-4px);
        }

        .detail-box h3{

            color:#777;

            font-size:14px;

            margin-bottom:8px;
        }

        .detail-box p{

            color:#333;

            font-size:20px;

            font-weight:bold;
        }

        .error{

            background:white;

            color:#d63031;

            padding:20px;

            border-radius:15px;

            text-align:center;
        }

        .back{

            display:block;

            text-align:center;

            margin-top:25px;

            color:white;

            text-decoration:none;

            font-weight:bold;

            transition:0.3s;
        }

        .back:hover{

            transform:
                scale(1.05);
        }


        @media(max-width:500px){

            .weather-container{
                padding:25px 18px;
            }

            .destination-grid{
                grid-template-columns:
                    1fr;
            }

            .temperature{
                font-size:60px;
            }

        }

    </style>

</head>


<body>


    <div class="weather-container">


        <h1>
            🌦️ Live Weather
        </h1>


        <p class="subtitle">

            Select your TravelGo destination

        </p>


        <!-- ONLY 4 DESTINATIONS -->

        <div class="destination-grid">


            <a href="?city=Ooty"
               class="destination-btn
               {% if selected_city == 'Ooty' %}active{% endif %}">

                🌿 Ooty

            </a>


            <a href="?city=Kodaikanal"
               class="destination-btn
               {% if selected_city == 'Kodaikanal' %}active{% endif %}">

                🏔️ Kodaikanal

            </a>


            <a href="?city=Munnar"
               class="destination-btn
               {% if selected_city == 'Munnar' %}active{% endif %}">

                🍃 Munnar

            </a>


            <a href="?city=Bangalore"
               class="destination-btn
               {% if selected_city == 'Bangalore' %}active{% endif %}">

                🏙️ Bangalore

            </a>


        </div>


        {% if error %}

            <div class="error">

                {{ error }}

            </div>

        {% endif %}


        {% if city %}

            <div class="weather-card">


                <div class="city">

                    📍 {{ city }}

                </div>


                <div class="temperature">

                    {{ temperature }}°C

                </div>


                <div class="description">

                    {{ description }}

                </div>


                <div class="details">


                    <div class="detail-box">

                        <h3>
                            💧 Humidity
                        </h3>

                        <p>

                            {{ humidity }}%

                        </p>

                    </div>


                    <div class="detail-box">

                        <h3>
                            💨 Wind
                        </h3>

                        <p>

                            {{ wind_speed }} m/s

                        </p>

                    </div>


                </div>


            </div>

        {% endif %}


        <a href="{% url 'home' %}"
           class="back">

            ← Back to Home

        </a>


    </div>


</body>

</html>
