<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Passenger Details - TravelGo</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;

            margin: auto;

            background: white;

            border-radius: 25px;

            padding: 35px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.25);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #51358c;
            margin-bottom: 10px;
        }

        .header p {
            color: #777;
        }

        .booking-summary {
            background: #f5f3ff;

            border-left: 5px solid #764ba2;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 30px;
        }

        .booking-summary h3 {
            color: #51358c;
            margin-bottom: 15px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;

            padding: 10px 0;

            border-bottom: 1px solid #ddd;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row strong {
            color: #333;
        }

        .total {
            color: #e8436f !important;
            font-size: 22px;
        }

        .form-title {
            color: #51358c;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
        }

        input,
        select {
            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #764ba2;

            box-shadow:
                0 0 0 3px rgba(118,75,162,0.12);
        }

        .continue-btn {
            width: 100%;

            margin-top: 30px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(
                90deg,
                #ff758c,
                #764ba2
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .continue-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(118,75,162,0.3);
        }

        .back-link {
            display: inline-block;

            margin-bottom: 25px;

            text-decoration: none;

            color: #764ba2;

            font-weight: bold;
        }

        @media (max-width: 600px) {

            .container {
                padding: 25px 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: span 1;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <a
            href="{% url 'seat_selection' %}?travel={{ travel_name|urlencode }}&destination={{ destination|urlencode }}"
            class="back-link"
        >
            ← Back to Seat Selection
        </a>


        <!-- HEADER -->

        <div class="header">

            <h1>
                👤 Passenger Details
            </h1>

            <p>
                Enter your details to continue your booking
            </p>

        </div>


        <!-- BOOKING SUMMARY -->

        <div class="booking-summary">

            <h3>
                🚌 Your Booking Summary
            </h3>


            <!-- TRAVEL -->

            <div class="summary-row">

                <span>
                    Travel
                </span>

                <strong>
                    {{ travel_name }}
                </strong>

            </div>


            <!-- DESTINATION -->

            <div class="summary-row">

                <span>
                    Destination
                </span>

                <strong>
                    {{ destination }}
                </strong>

            </div>


            <!-- SELECTED SEATS -->

            <div class="summary-row">

                <span>
                    Selected Seats
                </span>

                <strong>
                    {{ selected_seats }}
                </strong>

            </div>


            <!-- TOTAL -->

            <div class="summary-row">

                <span>
                    Total Amount
                </span>

                <strong class="total">
                    ₹{{ total_amount }}
                </strong>

            </div>

        </div>


        <!-- PASSENGER FORM -->

        <h2 class="form-title">

            Passenger Information

        </h2>


        <form method="POST">

            {% csrf_token %}


            <!-- HIDDEN BOOKING DETAILS -->

            <input
                type="hidden"
                name="selected_seats"
                value="{{ selected_seats }}"
            >

            <input
                type="hidden"
                name="total_amount"
                value="{{ total_amount }}"
            >

            <!-- TRAVEL NAME -->

            <input
                type="hidden"
                name="travel_name"
                value="{{ travel_name }}"
            >

            <!-- DESTINATION -->

            <input
                type="hidden"
                name="destination"
                value="{{ destination }}"
            >


            <div class="form-grid">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="full_name"
                        placeholder="Enter passenger name"
                        required
                    >

                </div>


                <!-- AGE -->

                <div class="form-group">

                    <label>
                        Age
                    </label>

                    <input
                        type="number"
                        name="age"
                        placeholder="Enter age"
                        min="1"
                        required
                    >

                </div>


                <!-- GENDER -->

                <div class="form-group">

                    <label>
                        Gender
                    </label>

                    <select
                        name="gender"
                        required
                    >

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- MOBILE -->

                <div class="form-group">

                    <label>
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        name="mobile"
                        placeholder="Enter mobile number"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group full-width">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter email address"
                        required
                    >

                </div>


            </div>


            <!-- SUBMIT BUTTON -->

            <button
                type="submit"
                class="continue-btn"
            >

                Continue to Review →

            </button>


        </form>


    </div>


</body>

</html>
