<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", "Segoe UI", sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background:
            radial-gradient(circle at 10% 15%, rgba(0, 198, 255, 0.35), transparent 25%),
            radial-gradient(circle at 90% 80%, rgba(255, 72, 150, 0.35), transparent 28%),
            linear-gradient(135deg, #111d4a, #4f46a5, #00a8cc);
        background-size: 150% 150%;
        animation: backgroundMove 10s ease-in-out infinite alternate;
    }

    @keyframes backgroundMove {
        0% {
            background-position: 0% 50%;
        }
        100% {
            background-position: 100% 50%;
        }
    }

    /* Floating circles */
    .circle {
        position: absolute;
        border-radius: 50%;
        filter: blur(2px);
        background: rgba(255, 255, 255, 0.12);
        animation: float 7s ease-in-out infinite;
    }

    .circle1 {
        width: 220px;
        height: 220px;
        top: -70px;
        left: -50px;
    }

    .circle2 {
        width: 300px;
        height: 300px;
        right: -100px;
        bottom: -100px;
        animation-delay: 2s;
    }

    .circle3 {
        width: 100px;
        height: 100px;
        right: 18%;
        top: 12%;
        background: rgba(255, 255, 255, 0.08);
        animation-delay: 1s;
    }

    @keyframes float {
        0%, 100% {
            transform: translateY(0) translateX(0);
        }

        50% {
            transform: translateY(-25px) translateX(15px);
        }
    }

    /* Main card */
    .card {
        width: 430px;
        max-width: 92%;
        padding: 42px 38px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow:
            0 30px 80px rgba(0, 0, 0, 0.30),
            0 0 40px rgba(92, 104, 255, 0.18);
        text-align: center;
        position: relative;
        z-index: 5;
        animation: cardIn 0.8s ease-out;
    }

    @keyframes cardIn {
        from {
            opacity: 0;
            transform: translateY(45px) scale(0.92);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    /* Logo */
    .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 78px;
        height: 78px;
        border-radius: 24px;
        font-size: 38px;
        margin-bottom: 18px;
        background: linear-gradient(135deg, #39c6ff, #6c5ce7, #ff5ca8);
        box-shadow: 0 12px 30px rgba(88, 92, 230, 0.30);
        animation: logoFloat 3s ease-in-out infinite;
    }

    @keyframes logoFloat {
        0%, 100% {
            transform: translateY(0) rotate(0deg);
        }

        50% {
            transform: translateY(-7px) rotate(3deg);
        }
    }

    h1 {
        font-size: 31px;
        font-weight: 800;
        margin-bottom: 10px;
        background: linear-gradient(90deg, #3949ab, #8e44ad, #ef476f);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .subtitle {
        color: #718096;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 28px;
    }

    /* Django messages */
    .messages {
        margin-bottom: 18px;
    }

    .message {
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
        background: #fff1f2;
        color: #e11d48;
        border: 1px solid #fecdd3;
    }

    /* Input */
    .input-box {
        text-align: left;
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 9px;
        color: #344054;
        font-size: 14px;
        font-weight: 700;
    }

    .input-wrapper {
        position: relative;
    }

    .input-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
        pointer-events: none;
    }

    input {
        width: 100%;
        height: 55px;
        padding: 0 16px 0 48px;
        border: 2px solid #e5e7eb;
        border-radius: 15px;
        outline: none;
        color: #1f2937;
        background: #ffffff;
        font-size: 14px;
        transition: all 0.3s ease;
    }

    input::placeholder {
        color: #9ca3af;
    }

    input:focus {
        border-color: #667eea;
        box-shadow:
            0 0 0 4px rgba(102, 126, 234, 0.10),
            0 8px 20px rgba(102, 126, 234, 0.10);
        transform: translateY(-1px);
    }

    /* Button */
    button {
        width: 100%;
        height: 56px;
        border: none;
        border-radius: 15px;
        background: linear-gradient(90deg, #20b8f2, #5964ee, #9145dc);
        background-size: 200% 100%;
        color: white;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.35s ease;
        box-shadow: 0 12px 25px rgba(89, 100, 238, 0.25);
        animation: buttonGradient 4s ease infinite;
    }

    @keyframes buttonGradient {
        0% {
            background-position: 0% 50%;
        }

        50% {
            background-position: 100% 50%;
        }

        100% {
            background-position: 0% 50%;
        }
    }

    button:hover {
        transform: translateY(-3px);
        box-shadow: 0 16px 30px rgba(89, 100, 238, 0.35);
    }

    button:active {
        transform: translateY(0);
    }

    /* Back to login */
    .back {
        display: inline-block;
        margin-top: 24px;
        text-decoration: none;
        color: #5964ee;
        font-size: 14px;
        font-weight: 700;
        transition: 0.3s ease;
    }

    .back:hover {
        color: #9145dc;
        transform: translateX(-3px);
    }

    .travel-text {
        margin-top: 22px;
        font-size: 12px;
        color: #98a2b3;
    }

    /* Mobile */
    @media (max-width: 500px) {
        .card {
            padding: 35px 24px;
        }

        h1 {
            font-size: 27px;
        }

        .circle3 {
            display: none;
        }
    }
</style>
```

</head>

<body>

```
<div class="circle circle1"></div>
<div class="circle circle2"></div>
<div class="circle circle3"></div>

<div class="card">

    <div class="logo">🧳🔐</div>

    <h1>Forgot Password?</h1>

    <p class="subtitle">
        Don't worry, traveler! 🌍<br>
        Enter your TravelGo username and we'll help<br>
        you create a new password.
    </p>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="input-box">
            <label for="username">TravelGo Username</label>

            <div class="input-wrapper">
                <span class="input-icon">👤</span>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>
        </div>

        <button type="submit">
            Continue to Reset Password 🔐
        </button>
    </form>

    <a href="{% url 'login' %}" class="back">
        ← Back to Login
    </a>

    <div class="travel-text">
        🚌 TravelGo · Your journey starts here
    </div>

</div>
```

</body>
