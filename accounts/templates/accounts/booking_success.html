<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Booking Successful - TravelGo</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 20px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2,
                #ff758c
            );

        }

        .success-container {

            width: 100%;
            max-width: 650px;

            background: white;

            border-radius: 25px;

            padding: 45px 35px;

            text-align: center;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.3);

        }

        .success-icon {

            width: 100px;
            height: 100px;

            margin: 0 auto 25px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: #e8f8ee;

            font-size: 50px;

        }

        h1 {

            color: #51358c;

            font-size: 32px;

            margin-bottom: 15px;

        }

        .message {

            color: #777;

            font-size: 16px;

            line-height: 1.6;

            margin-bottom: 30px;

        }

        .booking-card {

            background: #f5f3ff;

            border-radius: 15px;

            padding: 25px;

            text-align: left;

            margin-bottom: 30px;

            border-left:
                6px solid #764ba2;

        }

        .booking-card h2 {

            color: #51358c;

            margin-bottom: 20px;

            text-align: center;

        }

        .row {

            display: flex;

            justify-content: space-between;

            padding: 12px 0;

            border-bottom:
                1px solid #ddd;

        }

        .row:last-child {

            border-bottom: none;

        }

        .row span {

            color: #666;

        }

        .row strong {

            color: #333;

        }

        .booking-id {

            color: #e8436f !important;

            font-size: 18px;

        }

        .home-btn {

            display: inline-block;

            width: 100%;

            padding: 16px;

            border-radius: 12px;

            text-decoration: none;

            background: linear-gradient(
                90deg,
                #ff758c,
                #764ba2
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            transition: 0.3s;

        }

        .home-btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 10px 25px
                rgba(118,75,162,0.35);

        }

        @media (max-width: 600px) {

            .success-container {

                padding: 35px 20px;

            }

            h1 {

                font-size: 26px;

            }

            .row {

                flex-direction: column;

                gap: 5px;

            }

        }

    </style>

</head>


<body>


    <div class="success-container">


        <div class="success-icon">

            🎉

        </div>


        <h1>

            Booking Confirmed!

        </h1>


        <p class="message">

            Your bus ticket has been booked successfully.
            Have a safe and happy journey with TravelGo! 🚌✨

        </p>


        <div class="booking-card">


            <h2>

                🚌 Booking Details

            </h2>


            <div class="row">

                <span>

                    Booking ID

                </span>

                <strong class="booking-id">

                    TG{{ request.user.id }}2026

                </strong>

            </div>


            <div class="row">

                <span>

                    Travel

                </span>

                <strong>

                    Sathya Travels

                </strong>

            </div>


            <div class="row">

                <span>

                    Route

                </span>

                <strong>

                    Chennai → Bangalore

                </strong>

            </div>


            <div class="row">

                <span>

                    Status

                </span>

                <strong>

                    Confirmed ✅

                </strong>

            </div>


        </div>


        <a
            href="{% url 'home' %}"
            class="home-btn"
        >

            🏠 Back to Home

        </a>


    </div>


</body>

</html>
